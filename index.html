<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis comandos Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;--panel:#f1eee7;--card:#fffdf9;--card2:#f4f1ea;--line:#e6e1d6;--line2:#d9d3c5;
  --fg:#23211c;--fg2:#4f4a40;--mute:#8a8375;--acc:#3f5e74;--star:#c9932e;
  --code:#f4f1ea;--ok:#4f6b3a;--r:12px;
  --serif:'Fraunces',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(35,33,28,.04),0 2px 8px rgba(35,33,28,.04);
}
body.dark{
  --bg:#1c1b19;--panel:#211f1c;--card:#262421;--card2:#2d2a26;--line:#35322d;--line2:#44403a;
  --fg:#ece7dd;--fg2:#c5bfb2;--mute:#8f887a;--acc:#9fb7c9;--star:#d9ad5b;
  --code:#201e1b;--ok:#a9c08f;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;transition:background .2s}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:28px 16px}
.brand{padding:0 10px 22px}
.brand h1{font-family:var(--serif);font-size:24px;line-height:1.1;margin:0;font-weight:500;letter-spacing:-.01em}
.brand h1 em{font-style:italic;color:var(--acc)}
.brand small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.logo{display:none}
.navlbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:18px 10px 8px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--fg2)}
.nav button:hover{background:var(--card2);color:var(--fg)}
.nav button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc));flex:none;opacity:.9}
.nav .n{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;font-weight:400}

main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding:22px 40px 14px}
.searchwrap{display:flex;gap:10px;align-items:center;max-width:820px}
.search{flex:1;position:relative}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute)}
#q{width:100%;padding:13px 60px 13px 44px;font-size:15px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--fg);outline:none;font-family:inherit;box-shadow:var(--shadow);transition:border-color .15s}
#q::placeholder{color:var(--mute)}
#q:focus{border-color:var(--acc)}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;background:var(--card2)}
.iconbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;flex:none;font-size:16px;color:var(--fg2);box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--fg)}
.chips{display:none;gap:6px;overflow-x:auto;padding-top:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line2);background:var(--card);color:var(--fg2);display:flex;gap:6px;align-items:center}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}

.content{padding:10px 40px 90px;max-width:900px}
.meta{display:flex;align-items:center;gap:14px;color:var(--mute);font-size:13px;margin:4px 0 22px}
.meta button{all:unset;cursor:pointer;color:var(--acc);font-weight:500}
.meta button:hover{text-decoration:underline}
section{margin-bottom:38px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sechead h2{font-family:var(--serif);font-size:22px;margin:0;font-weight:500;letter-spacing:-.01em}
.sechead .n{font-size:13px;color:var(--mute)}
.sechead .dot{align-self:center}
.sechead hr{display:none}

.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card.sel{border-color:var(--acc)}
.card.open{border-color:var(--line2)}
.row{display:flex;align-items:center;gap:14px;padding:13px 14px 13px 18px;cursor:pointer}
.bar{display:none}
.rowtxt{min-width:0;flex:1}
.cmd{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt{font-size:13.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:2px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--fg2);white-space:nowrap;display:flex;align-items:center;gap:6px;margin-right:4px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.fav{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--line2);font-size:16px}
.fav:hover{color:var(--mute);background:var(--card2)}
.fav.on{color:var(--star)}
.chev{color:var(--mute);transition:transform .2s;font-size:10px;width:16px;text-align:center}
.card.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 22px 20px 18px}
.card.open .body{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sum{font-size:15px;line-height:1.65;color:var(--fg);margin:2px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
ul.pts{margin:8px 0 4px;padding:0;list-style:none}
ul.pts li{position:relative;padding:4px 0 4px 18px;font-size:14px;line-height:1.55;color:var(--fg2)}
ul.pts li::before{content:"";position:absolute;left:3px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 7px;font-weight:600}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--fg)}
pre.out{background:transparent;color:var(--ok);border-style:dashed}
.ex{position:relative}
.cp{position:absolute;top:8px;right:8px;font-size:11.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--card);color:var(--fg2);opacity:0;transition:opacity .15s;font-family:Inter,sans-serif}
.ex:hover .cp,.cp.done{opacity:1}
@media (hover:none){.cp{opacity:1}}
.cp.done{color:var(--ok);border-color:var(--ok)}
mark{background:color-mix(in srgb,var(--star) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mute);padding:70px 20px;font-size:15px;line-height:1.6}
.empty b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;color:var(--fg2);margin-bottom:6px}
.k{color:#8a4f7d}.s{color:#5b7a3a}.c{color:#9a9384;font-style:italic}.nn{color:#b0603a}.f{color:#3f5e74}
body.dark .k{color:#d0a3c4}body.dark .s{color:#b3c99a}body.dark .c{color:#7d776b}body.dark .nn{color:#e0a17e}body.dark .f{color:#9fb7c9}

/* --- curated menus --- */
.ico{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border-radius:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));border:1px solid color-mix(in srgb,var(--c) 22%,transparent);flex:none;letter-spacing:-.02em}
.ico.sm{min-width:30px;height:30px;font-size:12px;border-radius:8px}
.ico.lg{min-width:44px;height:44px;font-size:16px;border-radius:12px}
aside{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 92%,var(--acc)))}
.brand{display:grid;grid-template-columns:42px 1fr;gap:4px 12px;align-items:center}
.brand small{grid-column:1/-1;margin-top:10px}
.brand::before{content:"py";display:grid;place-items:center;width:42px;height:42px;border-radius:12px;flex:none;font-family:var(--mono);font-weight:600;font-size:15px;color:#fff;background:linear-gradient(135deg,#3f5e74,#5f8f86);box-shadow:0 4px 12px rgba(63,94,116,.25)}
.brand h1{font-size:20px}
.nav button{padding:6px 8px;gap:11px}
.nav button .lbltxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button.on{background:color-mix(in srgb,var(--c) 12%,var(--card));color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent)}
.nav button.on .n{color:var(--c);font-weight:600}
.nav button.on .ico{background:var(--c);color:#fff;border-color:transparent}
.chip{padding:4px 12px 4px 4px;gap:8px}
.chip .ico{min-width:24px;height:24px;font-size:10.5px;border-radius:99px}
.chip.on{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:color-mix(in srgb,var(--c) 40%,transparent);color:var(--fg)}
.chip.on .ico{background:var(--c);color:#fff}
.hero{background:linear-gradient(135deg,color-mix(in srgb,#3f5e74 10%,var(--card)),color-mix(in srgb,#5f8f86 10%,var(--card)));border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:40px;box-shadow:var(--shadow)}
.herotxt h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:0 0 6px;letter-spacing:-.01em}
.herotxt p{margin:0 0 20px;color:var(--fg2);font-size:15px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 6px 18px rgba(35,33,28,.08)}
.tile .ico{align-self:flex-start}
.tile .tname{font-weight:600;font-size:14px}
.tile .tn{font-size:12px;color:var(--mute);margin-top:-4px}
.sechead{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding:4px 0}
.sechead h2{font-size:22px}
.sechead p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.sechead .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:4px 10px;border-radius:99px}
.sechead.big{background:color-mix(in srgb,var(--c) 9%,var(--card));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-radius:16px;padding:18px 20px;margin-bottom:18px}
.sechead.big h2{font-size:26px}
.card{position:relative}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:0;transition:opacity .15s}
.card:hover::before,.card.open::before,.card.sel::before{opacity:1}
.row{padding-left:14px}
.tag{background:color-mix(in srgb,var(--c) 11%,var(--card));color:var(--fg2)}
ul.pts li::before{background:var(--c)}
.sum{border-top-color:color-mix(in srgb,var(--c) 20%,var(--line))}

@media (max-width:860px){
  .hero{padding:18px}
  .herotxt h2{font-size:24px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .sechead.big{padding:14px}
  .app{grid-template-columns:1fr}
  aside{display:none}
  .chips{display:flex}
  .top{padding:14px 16px 10px}
  .content{padding:8px 16px 60px}
  .tag{display:none}
  .kbd{display:none}
  #q{padding-right:14px}
  .sechead h2{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><h1>Mis comandos <em>Python</em></h1><small id="total"></small></div>
    <div class="nav" id="navTop"></div>
    <div class="navlbl">Temas</div>
    <div class="nav" id="nav"></div>
  </aside>
  <main>
    <div class="top">
      <div class="searchwrap">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="Buscar comando, método o concepto…" autocomplete="off" spellcheck="false">
          <span class="kbd">/</span>
        </div>
        <button class="iconbtn" id="theme" title="Cambiar tema claro/oscuro">☀</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="content">
      <div class="meta"><span id="info"></span><button id="toggleAll">Desplegar todo</button></div>
      <div id="list"></div>
    </div>
  </main>
</div>
<script>
const DATA = [
 {
  "tema": "Listas",
  "cmd": "lista = [1, 2, 3]",
  "titulo": "Crear una lista",
  "resumen": "Colección ordenada y MUTABLE, entre corchetes. Admite duplicados y tipos mezclados.",
  "ejemplos": [
   {
    "code": "vacia = []\nnumeros = [1, 2, 3, 3]\nmixta = [1, 'hola', True, 3.5]\nprint(numeros)",
    "out": "[1, 2, 3, 3]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista[i]  lista[a:b]  lista[-1]",
  "titulo": "Acceder a elementos",
  "resumen": "Índice entre corchetes (empieza en 0), rango [inicio:fin] con fin NO incluido, y negativos desde el final.",
  "ejemplos": [
   {
    "code": "l = [10, 20, 30, 40, 50]\nprint(l[0])\nprint(l[1:3])\nprint(l[-1])",
    "out": "10\n[20, 30]\n50"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista[i] = valor",
  "titulo": "Cambiar un elemento",
  "resumen": "Como las listas son mutables, puedes sustituir un elemento por su índice.",
  "ejemplos": [
   {
    "code": "l = [10, 20, 30]\nl[1] = 99\nprint(l)",
    "out": "[10, 99, 30]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.append(valor)",
  "titulo": "Añadir al final",
  "resumen": "Añade UN elemento al final de la lista.",
  "ejemplos": [
   {
    "code": "l = [1, 2]\nl.append(3)\nprint(l)",
    "out": "[1, 2, 3]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.insert(i, valor)",
  "titulo": "Insertar en una posición",
  "resumen": "Mete el valor en el índice indicado y desplaza el resto.",
  "ejemplos": [
   {
    "code": "l = ['a', 'c']\nl.insert(1, 'b')\nprint(l)",
    "out": "['a', 'b', 'c']"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.extend(colección)",
  "titulo": "Añadir varios elementos",
  "resumen": "Añade al final todos los elementos de otra lista/tupla/set. También vale lista1 + lista2 (crea una nueva).",
  "ejemplos": [
   {
    "code": "l = [1, 2]\nl.extend([3, 4])\nprint(l)\nprint(l + [5])",
    "out": "[1, 2, 3, 4]\n[1, 2, 3, 4, 5]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.remove(valor)",
  "titulo": "Eliminar por valor",
  "resumen": "Quita la PRIMERA aparición del valor. Si no existe → ValueError.",
  "ejemplos": [
   {
    "code": "l = [1, 2, 3, 2]\nl.remove(2)\nprint(l)",
    "out": "[1, 3, 2]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.pop(i)",
  "titulo": "Sacar por índice",
  "resumen": "Elimina y DEVUELVE el elemento en la posición i. Sin índice, saca el último.",
  "ejemplos": [
   {
    "code": "l = ['a', 'b', 'c']\nx = l.pop()\ny = l.pop(0)\nprint(x, y, l)",
    "out": "c a ['b']"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "del lista[i]",
  "titulo": "Borrar con del",
  "resumen": "Borra un elemento o un rango por índice (no devuelve nada).",
  "ejemplos": [
   {
    "code": "l = [1, 2, 3, 4]\ndel l[0]\ndel l[1:]\nprint(l)",
    "out": "[2]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.clear()",
  "titulo": "Vaciar la lista",
  "resumen": "Elimina todos los elementos.",
  "ejemplos": [
   {
    "code": "l = [1, 2, 3]\nl.clear()\nprint(l)",
    "out": "[]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.index(v)  lista.count(v)",
  "titulo": "Buscar y contar",
  "resumen": "index() da la posición del valor (error si no está); count() cuántas veces aparece (0 si no está).",
  "ejemplos": [
   {
    "code": "l = ['a', 'b', 'a']\nprint(l.index('b'))\nprint(l.count('a'))",
    "out": "1\n2"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.sort()  sorted(lista)",
  "titulo": "Ordenar",
  "resumen": "sort() ordena la propia lista; sorted() devuelve una lista nueva ordenada. reverse=True para orden descendente.",
  "ejemplos": [
   {
    "code": "l = [3, 1, 2]\nprint(sorted(l))\nl.sort(reverse=True)\nprint(l)",
    "out": "[1, 2, 3]\n[3, 2, 1]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.reverse()",
  "titulo": "Invertir el orden",
  "resumen": "Da la vuelta a la lista (no ordena, solo invierte). Alternativa sin modificar: lista[::-1].",
  "ejemplos": [
   {
    "code": "l = [1, 2, 3]\nl.reverse()\nprint(l)",
    "out": "[3, 2, 1]"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "len()  max()  min()  sum()",
  "titulo": "Funciones útiles con listas",
  "resumen": "Longitud, mayor, menor y suma de los elementos.",
  "ejemplos": [
   {
    "code": "l = [4, 8, 2]\nprint(len(l), max(l), min(l), sum(l))",
    "out": "3 8 2 14"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "for x in lista:  /  x in lista",
  "titulo": "Recorrer y comprobar",
  "resumen": "for recorre cada elemento; in devuelve True/False si el valor está.",
  "ejemplos": [
   {
    "code": "l = ['a', 'b']\nfor x in l:\n    print(x)\nprint('b' in l)",
    "out": "a\nb\nTrue"
   }
  ]
 },
 {
  "tema": "Listas",
  "cmd": "lista.copy()",
  "titulo": "Copiar una lista",
  "resumen": "Con b = a NO copias: las dos variables apuntan a la misma lista. Usa copy() para una copia real.",
  "ejemplos": [
   {
    "code": "a = [1, 2]\nb = a.copy()\nb.append(3)\nprint(a, b)",
    "out": "[1, 2] [1, 2, 3]"
   }
  ]
 },
 {
  "tema": "Tuplas",
  "cmd": "miTupla = ()",
  "titulo": "Crear una tupla",
  "resumen": "Colección ordenada e INMUTABLE. Usa paréntesis (las listas usan corchetes).",
  "puntos": [
   "Las tuplas no se pueden modificar; las listas sí.",
   "Se crean con valores separados por comas, con o sin paréntesis."
  ],
  "ejemplos": [

const ORDER=["General","Listas","Tuplas","Conjuntos","Diccionarios","Strings","Comprensiones","Operadores","Bit a bit","Ordenar","Control de flujo","Funciones","Grafos","Archivos","Entrada/Salida","Módulos","Eventos"];
const COLORS={"General":"#7d8597","Listas":"#5b7fa0","Tuplas":"#5f8f86","Conjuntos":"#7a9157","Diccionarios":"#c29a45","Strings":"#c07a52","Comprensiones":"#a56b84","Operadores":"#8170a3","Bit a bit":"#b06a62","Ordenar":"#4f8aa3","Control de flujo":"#6a9a6e","Funciones":"#b58a4a","Grafos":"#548c8c","Archivos":"#9a6e9e","Entrada/Salida":"#6f88b0","Módulos":"#8a7a5c","Eventos":"#b5715a"};
const ICONS={"General":"◆","Listas":"[ ]","Tuplas":"( )","Conjuntos":"{ }","Diccionarios":"{:}","Strings":"Aa","Comprensiones":"⟳","Operadores":"±","Bit a bit":"01","Ordenar":"↕","Control de flujo":"if","Funciones":"ƒ","Grafos":"◎","Archivos":"▤","Entrada/Salida":"⇄","Módulos":"▣","Eventos":"⚡"};
const DESC={"General":"Tipos, literales y herramientas básicas","Listas":"Colecciones ordenadas y modificables","Tuplas":"Colecciones ordenadas e inmutables","Conjuntos":"Elementos únicos y sin orden","Diccionarios":"Pares clave: valor","Strings":"Texto: comillas, escapes y cortes","Comprensiones":"Crear colecciones en una línea","Operadores":"Aritméticos, lógicos, comparación y precedencia","Bit a bit":"Operaciones sobre bits y binario","Ordenar":"sorted(), .sort() y criterios key","Control de flujo":"if, bucles for/while, break y continue","Funciones":"def, return y lambda","Grafos":"Nodos y enlaces con diccionarios","Archivos":"Abrir, leer, escribir y borrar","Entrada/Salida":"input() y print() en consola","Módulos":"import, módulos, paquetes y os/random","Eventos":"Eventos de ratón/teclado (turtle) y hooks"};
const ico=t=>ICONS[t]||'•';
const temas=[...ORDER.filter(t=>DATA.some(d=>d.tema===t)),...[...new Set(DATA.map(d=>d.tema))].filter(t=>!ORDER.includes(t))];
DATA.forEach((d,i)=>d.id=i);

const $=s=>document.querySelector(s);
const store={get(k,v){try{return JSON.parse(localStorage.getItem(k))??v}catch{return v}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let favs=new Set(store.get('favs',[]));
let tema=store.get('tema','Todos');
let open=new Set();
let sel=-1;
if(store.get('dark',false))document.body.classList.add('dark');

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const col=t=>COLORS[t]||'#7d8597';

function hl(text,q){
  const t=esc(text); if(!q) return t;
  const n=norm(text); let out='',i=0;
  const words=q.split(/\s+/).filter(Boolean);
  const marks=new Array(text.length).fill(false);
  words.forEach(w=>{let p=n.indexOf(w);while(p>-1){for(let k=p;k<p+w.length;k++)marks[k]=true;p=n.indexOf(w,p+1)}});
  for(let k=0;k<text.length;k++){
    const ch=esc(text[k]);
    if(marks[k]&&!marks[k-1])out+='<mark>';
    out+=ch;
    if(marks[k]&&!marks[k+1])out+='</mark>';
  }
  return out;
}
function syn(code){
  let h=esc(code);
  const toks=[];const keep=s=>{toks.push(s);return String.fromCharCode(0xE000+toks.length-1)};
  h=h.replace(/(#[^\n]*)/g,m=>keep(`<span class="c">${m}</span>`));
  h=h.replace(/(&quot;&quot;&quot;[\s\S]*?&quot;&quot;&quot;|[rfu]?'[^'\n]*'|[rfu]?&quot;[^\n]*?&quot;)/g,m=>keep(`<span class="s">${m}</span>`));
  h=h.replace(/\b(for|in|if|elif|else|while|break|continue|pass|def|return|lambda|and|or|not|is|None|True|False|import|with|as|del)\b/g,'<span class="k">$1</span>');
  h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="nn">$1</span>');
  h=h.replace(/\b([a-zA-Z_]\w*)(?=\()/g,'<span class="f">$1</span>');
  return h.replace(/[\uE000-\uEFFF]/g,ch=>toks[ch.charCodeAt(0)-0xE000]);
}
function score(d,q){
  if(!q)return 1;
  const words=q.split(/\s+/).filter(Boolean);
  let s=0;
  for(const w of words){
    const c=norm(d.cmd),t=norm(d.titulo),r=norm(d.resumen),rest=norm(JSON.stringify([d.puntos||[],d.ejemplos||[],d.tema]));
    let ws=0;
    if(c.includes(w))ws+=c.startsWith(w)?12:8;
    if(t.includes(w))ws+=6;
    if(r.includes(w))ws+=3;
    if(rest.includes(w))ws+=1;
    if(!ws)return 0;
    s+=ws;
  }
  return s;
}

function nav(){
  const cnt=t=>DATA.filter(d=>d.tema===t).length;
  const btn=(t,label,n,c,g)=>`<button data-t="${esc(t)}" class="${t===tema?'on':''}" style="--c:${c}"><span class="ico">${esc(g)}</span><span class="lbltxt">${label}</span><span class="n">${n}</span></button>`;
  $("#navTop").innerHTML=btn("Todos","Todos",DATA.length,"#3f5e74","☰")+btn("★","Favoritos",favs.size,"#c9932e","★");
  $("#nav").innerHTML=temas.map(t=>btn(t,esc(t),cnt(t),col(t),ico(t))).join("");
  $("#chips").innerHTML=[["Todos","Todos","#3f5e74","☰"],["★","Favoritos","#c9932e","★"],...temas.map(t=>[t,t,col(t),ico(t)])].map(([t,l,c,g])=>`<button class="chip ${t===tema?'on':''}" data-t="${esc(t)}" style="--c:${c}"><span class="ico">${esc(g)}</span>${esc(l)}</button>`).join("");
  $("#total").textContent=`${DATA.length} comandos · ${temas.length} temas`;
}

function card(d,q){
  const c=col(d.tema), isOpen=open.has(d.id)||(q&&visible.length<=3);
  const ex=(d.ejemplos||[]).map(e=>`
    <div class="lbl">Ejemplo</div>
    <div class="ex"><pre>${syn(e.code)}</pre><button class="cp" data-copy="${esc(e.code)}">Copiar</button></div>
    ${e.out?`<div class="lbl">Salida</div><pre class="out">${esc(e.out)}</pre>`:''}`).join("");
  return `<div class="card ${isOpen?'open':''}" data-id="${d.id}" style="--c:${c}">
    <div class="row">
      <span class="ico sm">${esc(ico(d.tema))}</span>
      <div class="rowtxt"><div class="cmd">${hl(d.cmd,q)}</div><div class="tt">${hl(d.titulo,q)}</div></div>
      <div class="acts">${tema==='★'||q?`<span class="tag">${esc(d.tema)}</span>`:''}
        <button class="fav ${favs.has(d.id)?'on':''}" data-fav="${d.id}" title="Favorito">${favs.has(d.id)?'★':'☆'}</button>
        <span class="chev">▶</span></div>
    </div>
    <div class="body">
      <p class="sum">${hl(d.resumen,q)}</p>
      ${d.puntos&&d.puntos.length?`<ul class="pts">${d.puntos.map(p=>`<li>${hl(p,q)}</li>`).join("")}</ul>`:''}
      ${ex}
    </div></div>`;
}

let visible=[];
function banner_(t,desc,c,g,n,small){return `<div class="sechead ${small?'':'big'}" style="--c:${c}"><span class="ico ${small?'':'lg'}">${esc(g)}</span><div><h2>${esc(t)}</h2><p>${esc(desc)}</p></div><span class="n">${n}</span></div>`}
function render(){
  const q=norm($("#q").value.trim());
  let items=DATA.filter(d=>tema==='Todos'||(tema==='★'?favs.has(d.id):d.tema===tema));
  if(q){items=items.map(d=>[d,score(d,q)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);}
  visible=items;
  if(sel>=items.length)sel=items.length-1;
  let html='';
  if(!items.length){
    html=tema==='★'&&!q?`<div class="empty"><b>Sin favoritos todavía</b><br>Pulsa la estrella de cualquier comando para guardarlo aquí.</div>`:`<div class="empty"><b>Nada por aquí</b>No hay resultados para «${esc($("#q").value)}»</div>`;
  } else if(q||tema!=='Todos'){
    const banner=!q&&tema!=='Todos'?(tema==='★'?banner_('Favoritos','Tus comandos guardados','#c9932e','★',items.length):banner_(tema,DESC[tema]||'',col(tema),ico(tema),items.length)):'';
    html=banner+`<div class="list">${items.map(d=>card(d,q)).join("")}</div>`;
  } else {
    const grid=`<div class="hero"><div class="herotxt"><h2>Hola, Francesc</h2><p>Tu chuleta de Python: ${DATA.length} comandos en ${temas.length} temas. Elige un tema o busca lo que necesites.</p></div>
      <div class="grid">${temas.map(t=>`<button class="tile" data-t="${esc(t)}" style="--c:${col(t)}"><span class="ico lg">${esc(ico(t))}</span><span class="tname">${esc(t)}</span><span class="tn">${DATA.filter(d=>d.tema===t).length} comandos</span></button>`).join("")}</div></div>`;
    html=grid+temas.map(t=>{const its=items.filter(d=>d.tema===t);return `<section>${banner_(t,DESC[t]||'',col(t),ico(t),its.length,true)}<div class="list">${its.map(d=>card(d,'')).join("")}</div></section>`}).join("");
    visible=temas.flatMap(t=>items.filter(d=>d.tema===t));
  }
  $("#list").innerHTML=html;
  $("#info").textContent=q?`${items.length} resultado${items.length===1?'':'s'}`:`${items.length} comando${items.length===1?'':'s'}${tema==='Todos'?'':' en '+(tema==='★'?'Favoritos':tema)}`;
  $("#toggleAll").textContent=visible.length&&visible.every(d=>open.has(d.id))?'Plegar todo':'Desplegar todo';
  markSel();
}
function markSel(){
  document.querySelectorAll('.card.sel').forEach(e=>e.classList.remove('sel'));
  if(sel<0||!visible[sel])return;
  const el=document.querySelector(`.card[data-id="${visible[sel].id}"]`);
  if(el){el.classList.add('sel');el.scrollIntoView({block:'nearest'});}
}
function setTema(t){tema=t;store.set('tema',t);sel=-1;nav();render();window.scrollTo({top:0});}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'); if(t){setTema(t.dataset.t);return;}
  const cp=e.target.closest('.cp');
  if(cp){navigator.clipboard.writeText(cp.dataset.copy.replace(/&quot;/g,'"')).then(()=>{cp.textContent='¡Copiado!';cp.classList.add('done');setTimeout(()=>{cp.textContent='Copiar';cp.classList.remove('done')},1300)}).catch(()=>{});return;}
  const f=e.target.closest('[data-fav]');
  if(f){const id=+f.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);store.set('favs',[...favs]);nav();render();return;}
  const row=e.target.closest('.row');
  if(row){const card=row.parentNode,id=+card.dataset.id;open.has(id)||card.classList.contains('open')?(open.delete(id),card.classList.remove('open')):(open.add(id),card.classList.add('open'));sel=visible.findIndex(d=>d.id===id);markSel();}
});
$("#q").addEventListener('input',()=>{sel=-1;render();});
$("#toggleAll").addEventListener('click',()=>{const all=visible.every(d=>open.has(d.id));visible.forEach(d=>all?open.delete(d.id):open.add(d.id));render();});
const themeIcon=()=>$("#theme").textContent=document.body.classList.contains('dark')?'☀':'☾';
$("#theme").addEventListener('click',()=>{document.body.classList.toggle('dark');store.set('dark',document.body.classList.contains('dark'));themeIcon();});themeIcon();
document.addEventListener('keydown',e=>{
  const inQ=document.activeElement===$("#q");
  if(e.key==='/'&&!inQ){e.preventDefault();$("#q").focus();$("#q").select();return;}
  if(e.key==='Escape'){if($("#q").value){$("#q").value='';render();}else $("#q").blur();return;}
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,visible.length-1);markSel();}
  if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);markSel();}
  if(e.key==='Enter'&&visible[sel]){const id=visible[sel].id;open.has(id)?open.delete(id):open.add(id);render();}
});
if(tema!=='Todos'&&tema!=='★'&&!temas.includes(tema))tema='Todos';
nav();render();
</script>
